name: book-portal

services:
  mysql:
    image: mysql:8.0
    container_name: portal_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  app:
    build: .
    container_name: portal_app
    restart: unless-stopped
    env_file: .env
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - data:/app/data
    # This app makes outbound calls to Google APIs (Drive, Gemini, OAuth) -
    # `EAI_AGAIN` against two different *.googleapis.com hosts in the same
    # session points at DNS resolution on this container generally rather
    # than either service specifically. Pinning to known-reliable public
    # resolvers instead of whatever the host forwards is a safe default
    # regardless of whether that turns out to be the whole story.
    dns:
      - 1.1.1.1
      - 8.8.8.8

  caddy:
    build: ./proxy
    container_name: portal_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DUCKDNS_TOKEN: ${DUCKDNS_TOKEN}
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - app

volumes:
  mysqldata:
  data:
  caddydata:
  caddyconfig: