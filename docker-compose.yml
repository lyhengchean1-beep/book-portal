# An explicit project name, so containers, networks and volumes are namespaced
# regardless of what the directory is called. Without it Compose derives the
# name from the folder, and two projects in similarly named folders can end up
# fighting over the same resources.
name: book-portal

services:
  mysql:
    image: mysql:8.0
    container_name: portal_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    # utf8mb4 end to end, so Khmer titles and author names store and sort
    # correctly. MySQL 8 defaults to this, but being explicit costs nothing.
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysqldata:/var/lib/mysql
    # Deliberately no `ports:`. The app reaches this over the compose network,
    # so nothing is published on the host and there is no chance of colliding
    # with a MySQL another project already has on 3306.
    healthcheck:
      # Runs MySQL's own client inside the MySQL container, so there is no
      # MariaDB-client TLS mismatch to work around. No --silent: if the ping
      # fails you want to see why, not watch an endless "waiting" loop.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  app:
    build: .
    container_name: portal_app
    restart: unless-stopped
    env_file: .env
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      # Host 3100, container 3000. Change the left number only - the right one
      # is what Next.js listens on inside the container. 3100 keeps this clear
      # of anything already using 3000 on the host.
      - "${HOST_PORT:-3100}:3000"
    # Nothing needs mounting on the app container - thumbnails live in MySQL
    # alongside the catalogue, and Drive access is granted by each user at
    # sign-in, so there are no key files to manage either.

volumes:
  mysqldata:
